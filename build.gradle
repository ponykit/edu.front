plugins {
    id 'org.springframework.boot' version '2.3.3.RELEASE'
    id 'io.spring.dependency-management' version '1.0.10.RELEASE'
    id 'java'
    id 'war'
}
group = 'com.edu'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'

//bootWar{                        //bootWar Task시 이름 지정
//    archiveBaseName="eduyan"
//    archiveVersion="0.0.1-SNAPSHOT"
//}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

//ext['tomcat.version'] = '8.5.57'

//bootWar.enabled = false
//war.enabled = true

dependencies {
    // JAX-B dependencies for JDK 9+
    implementation "javax.xml.bind:jaxb-api:2.2.11"
    implementation "com.sun.xml.bind:jaxb-core:2.2.11"
    implementation "com.sun.xml.bind:jaxb-impl:2.2.11"
    implementation "javax.activation:activation:1.1.1"

    //   implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation group: 'nz.net.ultraq.thymeleaf', name: 'thymeleaf-layout-dialect', version: '2.4.1'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.1.3'
    implementation group: 'org.mindrot', name: 'jbcrypt', version: '0.3m'   //암호화
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'  //DB 로그
    implementation group: 'org.jcodec', name: 'jcodec-javase', version: '0.2.2'
    implementation group: 'net.bramp.ffmpeg', name: 'ffmpeg', version: '0.6.2'
    implementation 'com.github.pagehelper:pagehelper:5.1.10'
    compileOnly 'org.projectlombok:lombok'
    compile 'org.apache.commons:commons-lang3:3.11'
    compile 'commons-io:commons-io:2.7'
    compile 'junit:junit:4.12'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
    annotationProcessor 'org.projectlombok:lombok'
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
    testCompile 'junit:junit:4.12'
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
//    testImplementation 'org.springframework.security:spring-security-test'
}

test {
    useJUnitPlatform()
}
